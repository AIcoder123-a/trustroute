# Does a cloud egress get the same 403, or a real answer?
#
# This is the cheapest way to find out whether the browser-integrity challenge
# that blocks server-side calls from the build machine also blocks a normal
# datacenter egress — without deploying anything and without spending money.
#
# Run it from the repository's Actions tab ("Run workflow"). It makes exactly
# three paid calls (12–19 credits) against the account that owns the secret.
#
# Setup, once:
#   1. Settings → Secrets and variables → Actions → New repository secret
#   2. Name: CLOCKED_API_KEY, value: the key. It is never printed by the script.
#
# Read the result with docs/DEPLOYMENT.md §3.

name: live-check

on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. Every run spends the account's credits, so a double click
# on "Run workflow" must not become two sets of three paid calls.
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    name: three real Clocked calls from a GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job pushes; keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Ask Clocked for three detections
        env:
          CLOCKED_API_KEY: ${{ secrets.CLOCKED_API_KEY }}
        # The script prints status, shape, verdict and source; it never prints
        # the key, the request text or an entity value.
        run: npm run accept:live

      - name: Keep the acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance
          path: .local/live-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::If the output is 403 with cf-mitigated: challenge, this egress is challenged too."
          echo "::notice::Record the cf-ray and compare it with docs/DEPLOYMENT.md §3 before drawing a conclusion."
