# Render Blueprint — the deployment this project intends to use.
#
# Nothing here is deployed by the repository: Render reads this file only after
# the owner connects the repository in the dashboard. This file declares **no
# secret**: creating the service asks for nothing, and the simulated deployment
# therefore has no credential to leak. Secrets are added in the dashboard when a
# later phase needs them, and are never written here.
#
# Verified against https://render.com/docs/free and /docs/web-services on 2026-11-01.
services:
  - type: web
    name: trustroute
    runtime: node
    plan: free
    region: oregon
    # `npm ci` for a lockfile-exact install; `next build` needs the whole tree.
    buildCommand: npm ci && npm run build
    # Render forwards to $PORT (default 10000) and requires the bind on 0.0.0.0.
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    # Cheap, always-200, and it publishes the mode without the key.
    healthCheckPath: /api/status
    autoDeploy: false
    envVars:
      # Next 16 needs Node 20+; 22 matches the version this was tested on.
      - key: NODE_VERSION
        value: "22"
      # Start simulated — and stay simulated until §10 of docs/RENDER.md is done.
      - key: CLOCKED_MODE
        value: mock
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: DAILY_SCREENS
        value: "40"
      # Render's load balancer is the only writer of x-forwarded-for in front of
      # this service, so the header can be believed here.
      - key: TRUST_PROXY
        value: "1"
      - key: TURNSTILE_ENABLED
        value: "false"
      # No secret is declared here on purpose. A blueprint that declares
      # `sync: false` variables makes the dashboard ask for them at creation
      # time, and the first deployment should never be given a credential: the
      # mock cannot use one and therefore cannot leak one.
      #
      # Add these in the dashboard, in this order, when the corresponding phase
      # is actually being run (docs/RENDER.md §7.3, §8 phase 2, §10):
      #   UPSTASH_REDIS_REST_URL    phase 2 — shared day ceiling, before live
      #   UPSTASH_REDIS_REST_TOKEN  phase 2 — same
      #   CLOCKED_API_KEY           phase 2 — only to switch to live
      #   TURNSTILE_SITE_KEY        later  — needs the widget, see §5
      #   TURNSTILE_SECRET          later  — same
